name: PR Reviewer

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_run:
    workflows: ['CI']
    types:
      - completed
  schedule:
    - cron: '0 * * * *' # Every hour

permissions:
  pull-requests: write
  issues: write
  contents: read

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # Need to checkout for dogfooding if using ./
      # Dogfooding is only evidence if it runs the code we ship. This was
      # pinned at `feat/sweep-performance-optimizations` for long enough that
      # everything merged after it — PR-085, PR-086 — was absent from the bot
      # reviewing our own PRs, while the green `triage` check implied otherwise.
      - uses: wagmiiii/pr-reviewer@main
        with:
          dryRun: 'false'
